<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моей любимой Алеси 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            font-family: 'Montserrat', sans-serif;
            color: #5a3d40;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Плавающие сердечки на фоне */
        .bg-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 40px 30px;
            border-radius: 30px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(238, 156, 167, 0.3);
            z-index: 2;
            position: relative;
        }

        .heart-icon {
            font-size: 50px;
            color: #ff6b81;
            animation: heartbeat 1.5s infinite;
            margin-bottom: 15px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #b33939;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 15px;
            color: #8c6267;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .reason-box {
            background: #fff0f3;
            border: 1px dashed #ffb6c1;
            padding: 20px;
            border-radius: 15px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            font-size: 16px;
            font-weight: 500;
            color: #7a4248;
            transition: all 0.3s ease;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b81 0%, #ff4757 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 71, 87, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #a6797e;
        }
    </style>
</head>
<body>

    <!-- Фон с летящими сердечками -->
    <div class="bg-hearts" id="bgHearts"></div>

    <div class="card">
        <div class="heart-icon">❤️</div>
        <h1>Алеся, это для тебя</h1>
        <p class="subtitle">Я создал эту страничку просто чтобы напомнить, как сильно я тебя люблю. Нажми на кнопку ниже 👇</p>
        
        <div class="reason-box" id="reasonText">
            Нажми на кнопку, чтобы узнать причину... ✨
        </div>

        <button class="btn" onclick="showReason()">Узнать причину 💕</button>
        
        <div class="footer-note">Сделано с бесконечной любовью для тебя</div>
    </div>

    <script>
        // Твои причины (можешь добавлять или менять текст в кавычках)
        const reasons = [
            "Твоя улыбка освещает даже самый пасмурный день 😊",
            "С тобой невероятно уютно и тепло в любой ситуации 🧸",
            "У тебя потрясающий смех, от которого у меня самого поднимается настроение ✨",
            "Ты понимаешь меня с полуслова и разделяешь мои мысли 🌸",
            "Рядом с тобой мне хочется становиться лучше каждый день 💫",
            "Твои глаза — это первое, о чем я думаю с утра и перед сном 💖",
            "Ты безумно красивая, нежная и особенная 🌷",
            "Просто потому, что ты есть в моей жизни, и это лучшее, что случалось ❤️"
        ];

        function showReason() {
            const reasonBox = document.getElementById('reasonText');
            // Анимация смены текста
            reasonBox.style.opacity = 0;
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * reasons.length);
                reasonBox.textContent = reasons[randomIndex];
                reasonBox.style.opacity = 1;
            }, 150);
        }

        // Плавная анимация появления текста
        document.getElementById('reasonText').style.transition = "opacity 0.2s ease";

        // Генерация плавающих сердечек на фоне
        const bgHearts = document.getElementById('bgHearts');
        const heartSymbols = ['❤️', '💖', '💕', '💗', '✨'];

        function createBgHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's'; // от 4 до 7 секунд
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            bgHearts.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createBgHeart, 400);
    </script>
</body>
</html>
